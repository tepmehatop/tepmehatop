# Variant 2 — redraws the living banner with fresh contribution data every day.
name: Redraw banner

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/svg/**'
      - 'profile.config.json'
      - 'scripts/render-banner.mjs'
      - '.github/workflows/banner.yml'

permissions:
  contents: write

concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ssr
      - run: node scripts/render-banner.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet && exit 0
          git commit -m "chore: redraw banner"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
